<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <defs>
    <linearGradient id="zippGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="zippGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Emblem Badge -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="#0E1526" stroke="url(#zippGrad)" stroke-width="2" />
    <!-- Dynamic Z Speed Icon with Lightning Flash -->
    <path d="M16 18 H44 L28 35 H44 L16 48 L22 35 H16 Z" fill="url(#boltGrad)" filter="url(#zippGlow)" />
    <!-- Speed Lines -->
    <line x1="8" y1="24" x2="14" y2="24" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="6" y1="36" x2="12" y2="36" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Wordmark -->
  <text x="82" y="47" font-family="'Syne', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="34" letter-spacing="1.5" fill="#FFFFFF">ZIPP</text>
  <circle cx="186" cy="27" r="4" fill="#06B6D4" />
  <text x="83" y="62" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="9" letter-spacing="2.8" fill="#94A3B8">VEHICLE CARE ON-DEMAND</text>
</svg>
